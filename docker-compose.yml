# ==============================================================================
# Jinishpotro Production Stack
# Services: Web Application (PHP 8.2 + Apache), MySQL 8.0 Database
# Domain: jinishpotro.store
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Main Web Application & Background Workers (PHP 8.2 + Apache)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jinispotro_app
    restart: unless-stopped
    ports:
      - "${PORT_HTTP:-80}:80"
      - "${PORT_HTTPS:-443}:443"
    environment:
      # Database connection
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-php_admin_panel}
      DB_USER: ${DB_USER:-jinispotro}
      DB_PASS: ${DB_PASS:-secret123}
      DB_CHARSET: utf8mb4

      # AWS S3 Storage (Configurable via Admin Panel or .env)
      STORAGE_PRIMARY: ${STORAGE_PRIMARY:-s3}
      STORAGE_FALLBACK: ${STORAGE_FALLBACK:-local}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX:-uploads/}
      STORAGE_S3_DELIVERY: ${STORAGE_S3_DELIVERY:-public}

      # App Settings
      APP_NAME: "${APP_NAME:-Jinishpotro E-Commerce}"
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-c84f1a29e46a78b901d3e5f72a6b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b}
      BASE_URL: ${BASE_URL:-/}
      SITE_URL: ${SITE_URL:-https://jinishpotro.store}
      FORCE_HTTPS: ${FORCE_HTTPS:-true}
    volumes:
      - app_uploads:/var/www/html/assets/uploads
      - app_storage:/var/www/html/storage
      # Mount host Let's Encrypt certificates if available on host
      - ${LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - jinispotro_net

  # ----------------------------------------------------------------------------
  # 2. Database Service (MySQL 8.0)
  # ----------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: jinispotro_db
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=250
    environment:
      MYSQL_DATABASE: ${DB_NAME:-php_admin_panel}
      MYSQL_USER: ${DB_USER:-jinispotro}
      MYSQL_PASSWORD: ${DB_PASS:-secret123}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret123}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - jinispotro_net

volumes:
  db_data:
    driver: local
  app_uploads:
    driver: local
  app_storage:
    driver: local

networks:
  jinispotro_net:
    driver: bridge
