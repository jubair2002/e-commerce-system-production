# ==============================================================================
# Jinish Potro Production Stack with Automatic SSL
# Services:
#   - caddy: Automatic HTTPS Reverse Proxy (Let's Encrypt / ZeroSSL TLS)
#   - app: Rust High-Performance Backend (Axum + SQLx + Tokio)
#   - db: MySQL 8.0 Database (Auto-initialized with schema.sql)
#   - prometheus & grafana: Monitoring & Observability
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 0. Edge Reverse Proxy (Automatic HTTPS SSL for jinishpotro.store)
  # ----------------------------------------------------------------------------
  proxy:
    image: caddy:2-alpine
    container_name: jinispotro_proxy
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
      - "0.0.0.0:443:443/udp" # HTTP/3 QUIC support
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./assets:/app/assets:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - jinispotro_net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # 1. Main Web Application (High-Performance Rust Backend)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: rust-backend/Dockerfile
    container_name: jinispotro_app
    restart: unless-stopped
    expose:
      - "80"
    ports:
      # Direct loopback access for local CLI or metrics check
      - "127.0.0.1:8080:80"
      - "127.0.0.1:${PORT_METRICS:-8082}:8082"
    environment:
      # Network binding
      HOST: "0.0.0.0"
      PORT: "80"

      # Database connection (Connects to internal 'db' service)
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-php_admin_panel}
      DB_USER: ${DB_USER:-jinispotro}
      DB_PASS: ${DB_PASS:-secret123}
      DB_CHARSET: utf8mb4

      # AWS S3 Storage (Configurable via Admin Panel or .env)
      STORAGE_PRIMARY: ${STORAGE_PRIMARY:-local}
      STORAGE_FALLBACK: ${STORAGE_FALLBACK:-none}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX:-uploads/}
      STORAGE_S3_DELIVERY: ${STORAGE_S3_DELIVERY:-public}

      # Application Configuration
      APP_NAME: "${APP_NAME:-Jinish Potro}"
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-c84f1a29e46a78b901d3e5f72a6b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b}
      BASE_URL: ${BASE_URL:-/}
      SITE_URL: ${SITE_URL:-https://jinishpotro.store}
      TEMPLATES_DIR: /app/templates
      ASSETS_DIR: /app/assets
      UPLOADS_DIR: /app/assets/uploads
      RUST_LOG: info
    volumes:
      - app_uploads:/app/assets/uploads
      - ./assets:/app/assets:ro
      - ./rust-backend/templates:/app/templates:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - jinispotro_net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # 2. Database Service (MySQL 8.0)
  # ----------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: jinispotro_db
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=250
    environment:
      MYSQL_DATABASE: ${DB_NAME:-php_admin_panel}
      MYSQL_USER: ${DB_USER:-jinispotro}
      MYSQL_PASSWORD: ${DB_PASS:-secret123}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret123}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - jinispotro_net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # 3. Prometheus Monitoring Service (Scrapes Rust /metrics)
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: jinispotro_prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    networks:
      - jinispotro_net

  # ----------------------------------------------------------------------------
  # 4. Grafana Dashboards Service
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: jinispotro_grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - jinispotro_net

  # ----------------------------------------------------------------------------
  # 5. Optional Legacy PHP Application (Accessible with --profile php on :8081)
  # ----------------------------------------------------------------------------
  php-app:
    profiles:
      - php
      - legacy
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jinispotro_php_legacy
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-php_admin_panel}
      DB_USER: ${DB_USER:-jinispotro}
      DB_PASS: ${DB_PASS:-secret123}
      DB_CHARSET: utf8mb4
      APP_NAME: "${APP_NAME:-Jinishpotro E-Commerce (PHP)}"
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-c84f1a29e46a78b901d3e5f72a6b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b}
      BASE_URL: ${BASE_URL:-/}
      SITE_URL: ${SITE_URL:-http://localhost:8081}
    volumes:
      - app_uploads:/var/www/html/assets/uploads
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - jinispotro_net

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  db_data:
    driver: local
  app_uploads:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  jinispotro_net:
    driver: bridge
