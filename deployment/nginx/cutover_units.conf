# ==============================================================================
# Jinishpotro 3-Unit Cutover Upstream Configuration
# Toggling any unit between PHP and Rust is a one-line change followed by:
# sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

# Backend Definitions
upstream rust_backend {
    server 127.0.0.1:8082 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

upstream php_backend {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# Unit 1: Storefront, Customer Account & Public API (/api/*, /account/*, /)
# Set to 'rust_backend' for Rust Axum, or 'php_backend' for Apache/PHP-FPM.
# ------------------------------------------------------------------------------
map $uri $unit1_upstream {
    default rust_backend;
    # default php_backend;
}

# ------------------------------------------------------------------------------
# Unit 2: Admin Control Panel (/admin/*)
# Set to 'rust_backend' for Rust Axum, or 'php_backend' for Apache/PHP-FPM.
# ------------------------------------------------------------------------------
map $uri $unit2_upstream {
    default rust_backend;
    # default php_backend;
}
