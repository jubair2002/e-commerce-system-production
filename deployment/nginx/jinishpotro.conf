# ==============================================================================
# Jinishpotro High-Performance Production Nginx Configuration
# Fully reproduces all Apache .htaccess rules & supports 3-Unit Cutover
# ==============================================================================

include /etc/nginx/conf.d/cutover_units.conf;

server {
    listen 80;
    listen [::]:80;
    server_name jinishpotro.store www.jinishpotro.store localhost;

    root /var/www/html;
    index index.php index.html;

    # --------------------------------------------------------------------------
    # 1. Global Security Directives & Sensitive Directory Denials
    # (Matches .htaccess Lines 7-11 and general directory protection)
    # --------------------------------------------------------------------------
    server_tokens off;

    # Deny direct access to .env, .git, and hidden files
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Deny internal directories
    location ~ ^/(config|includes|sql|cron|storage|rust-backend)/ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Deny access to sensitive extensions
    location ~ \.(sql|bak|inc|ini|log|sh|tera)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Security Headers (.htaccess Lines 167-170)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # --------------------------------------------------------------------------
    # 2. Gzip & Deflate Compression (.htaccess Lines 138-142)
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;

    # --------------------------------------------------------------------------
    # 3. Direct Disk Serving for Static Assets & Uploads (.htaccess Lines 147-162)
    # Sub-millisecond static file delivery without touching PHP or Rust backend.
    # --------------------------------------------------------------------------
    location /assets/ {
        alias /var/www/html/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ^~ /uploads/ {
        alias /var/www/html/assets/uploads/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        # Fallback to dynamic media handler if not on disk (.htaccess Line 35)
        try_files $uri @dynamic_media;
    }

    location @dynamic_media {
        rewrite ^/(?:assets/)?uploads/(.+)$ /uploads.php?file=$1 last;
    }

    # --------------------------------------------------------------------------
    # 4. 301 Legacy Redirects (.htaccess Lines 39-55)
    # --------------------------------------------------------------------------
    location = /shop.php                { return 301 /shop$is_args$args; }
    location = /category.php            { return 301 /shop$is_args$args; }
    location = /product.php             { return 301 /shop$is_args$args; }
    location = /cart.php                { return 301 /cart$is_args$args; }
    location = /checkout.php            { return 301 /checkout$is_args$args; }
    location = /order_confirmation.php  { return 301 /order/confirmation$is_args$args; }
    location = /track.php               { return 301 /track$is_args$args; }
    location = /login.php               { return 301 /login$is_args$args; }
    location = /register.php            { return 301 /register$is_args$args; }
    location = /logout.php              { return 301 /logout$is_args$args; }
    location = /forgot_password.php     { return 301 /forgot-password$is_args$args; }
    location = /reset_password.php      { return 301 /reset-password$is_args$args; }
    location = /verify_email.php        { return 301 /verify-email$is_args$args; }
    location = /resend_verification.php { return 301 /resend-verification$is_args$args; }
    location = /maintenance.php         { return 301 /maintenance$is_args$args; }
    location = /404.php                 { return 301 /404$is_args$args; }
    location = /sitemap.php             { return 301 /sitemap.xml$is_args$args; }

    # --------------------------------------------------------------------------
    # 5. Unit 2: Admin Panel Proxy Routing (/admin/*)
    # --------------------------------------------------------------------------
    location /admin {
        proxy_pass http://$unit2_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Disable buffering for real-time monitoring/SSE
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # --------------------------------------------------------------------------
    # 6. Prometheus Metrics Endpoint Scrape (Direct to Rust backend)
    # --------------------------------------------------------------------------
    location = /metrics {
        proxy_pass http://rust_backend/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    # --------------------------------------------------------------------------
    # 7. Unit 1: Storefront, Account & Public API (/api/*, /account/*, /)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://$unit1_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Proxy buffers
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_read_timeout 60s;
    }
}
