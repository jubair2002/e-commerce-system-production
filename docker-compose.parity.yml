# ==============================================================================
# Jinish Potro Parity Environment Stack
# Services:
#   - db: MySQL 8.0 (shared by PHP and Rust)
#   - php-app: PHP 8.2 + Apache (port :8081, built from untouched Dockerfile)
#   - rust-app: Axum + SQLx + Tokio (port :8082, built from rust-backend/Dockerfile)
#   - nginx: Front reverse proxy (port :8080)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Shared MySQL 8.0 Database
  # ----------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: jinispotro_parity_db
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=250
    environment:
      MYSQL_DATABASE: ${DB_NAME:-php_admin_panel}
      MYSQL_USER: ${DB_USER:-jinispotro}
      MYSQL_PASSWORD: ${DB_PASS:-secret123}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret123}
    ports:
      - "3306:3306"
    volumes:
      - parity_db_data:/var/lib/mysql
      - ./docker/parity-initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - parity_net

  # ----------------------------------------------------------------------------
  # 2. PHP Web Application (Untouched Dockerfile, Port 8081)
  # ----------------------------------------------------------------------------
  php-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jinispotro_parity_php
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-php_admin_panel}
      DB_USER: ${DB_USER:-jinispotro}
      DB_PASS: ${DB_PASS:-secret123}
      DB_CHARSET: utf8mb4
      APP_ENV: local
      APP_KEY: ${APP_KEY:-c84f1a29e46a78b901d3e5f72a6b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b}
      BASE_URL: /
      SITE_URL: http://localhost:8081
      FORCE_HTTPS: "false"
      STORAGE_PRIMARY: local
      STORAGE_FALLBACK: none
    volumes:
      - parity_uploads:/var/www/html/assets/uploads
      - parity_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - parity_net

  # ----------------------------------------------------------------------------
  # 3. Rust Web Application (Port 8082)
  # ----------------------------------------------------------------------------
  rust-app:
    build:
      context: .
      dockerfile: rust-backend/Dockerfile
    container_name: jinispotro_parity_rust
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-php_admin_panel}
      DB_USER: ${DB_USER:-jinispotro}
      DB_PASS: ${DB_PASS:-secret123}
      DB_CHARSET: utf8mb4
      PORT: 8082
      HOST: 0.0.0.0
      APP_ENV: local
      APP_KEY: ${APP_KEY:-c84f1a29e46a78b901d3e5f72a6b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b}
      BASE_URL: /
      SITE_URL: http://localhost:8082
      TEMPLATES_DIR: /app/templates
      ASSETS_DIR: /app/assets
      UPLOADS_DIR: /app/assets/uploads
      STORAGE_PRIMARY: local
      STORAGE_FALLBACK: none
      RUST_LOG: info
    volumes:
      - parity_uploads:/app/assets/uploads
      - ./assets:/app/assets:ro
      - ./rust-backend/templates:/app/templates:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - parity_net

  # ----------------------------------------------------------------------------
  # 4. Nginx Front Reverse Proxy (Port 8080)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: jinispotro_parity_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.parity.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php-app
      - rust-app
    networks:
      - parity_net

volumes:
  parity_db_data:
    driver: local
  parity_uploads:
    driver: local
  parity_storage:
    driver: local

networks:
  parity_net:
    driver: bridge
