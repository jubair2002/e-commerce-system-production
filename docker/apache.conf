# ==============================================================================
# Jinishpotro Apache Virtual Host Configuration
# Ports: 80 (HTTP) and 443 (HTTPS)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. HTTP VirtualHost (Port 80)
# ------------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName jinishpotro.store
    ServerAlias www.jinishpotro.store localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Forward client real IP from reverse proxies / AWS ALB / CloudFront / Cloudflare
    <IfModule mod_remoteip.c>
        RemoteIPHeader X-Forwarded-For
        RemoteIPTrustedProxy 10.0.0.0/8
        RemoteIPTrustedProxy 172.16.0.0/12
        RemoteIPTrustedProxy 192.168.0.0/16
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# ------------------------------------------------------------------------------
# 2. HTTPS VirtualHost (Port 443)
# ------------------------------------------------------------------------------
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName jinishpotro.store
    ServerAlias www.jinishpotro.store localhost
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile ${APACHE_SSL_CERT}
    SSLCertificateKeyFile ${APACHE_SSL_KEY}

    # Modern TLS Security & Ciphers
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder off
    SSLSessionTickets off

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Forward client real IP from reverse proxies / AWS ALB / CloudFront / Cloudflare
    <IfModule mod_remoteip.c>
        RemoteIPHeader X-Forwarded-For
        RemoteIPTrustedProxy 10.0.0.0/8
        RemoteIPTrustedProxy 172.16.0.0/12
        RemoteIPTrustedProxy 192.168.0.0/16
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/ssl_access.log combined
</VirtualHost>
</IfModule>
