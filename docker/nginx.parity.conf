# ==============================================================================
# Jinish Potro Parity Nginx Front Proxy Configuration
# Listens on port 80 (mapped to 8080 on host)
# Routes requests to PHP (:8081) or Rust (:8082)
# ==============================================================================

upstream php_upstream {
    server php-app:80 max_fails=3 fail_timeout=10s;
}

upstream rust_upstream {
    server rust-app:8082 max_fails=3 fail_timeout=10s;
}

# Header-based routing: X-Backend: "rust" or "php" (default: "php")
map $http_x_backend $backend_target {
    "rust"       http://rust_upstream;
    "php"        http://php_upstream;
    default      http://php_upstream;
}

server {
    listen 80;
    server_name localhost _;

    client_max_body_size 64M;

    # Dedicated prefix for direct PHP inspection
    location /parity/php/ {
        rewrite ^/parity/php/(.*) /$1 break;
        proxy_pass http://php_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dedicated prefix for direct Rust inspection
    location /parity/rust/ {
        rewrite ^/parity/rust/(.*) /$1 break;
        proxy_pass http://rust_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Main routing entrypoint (respects X-Backend header, defaults to PHP)
    location / {
        proxy_pass $backend_target;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / Server-Sent Events (SSE) support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }
}
