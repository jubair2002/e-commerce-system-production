global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 1. Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Jinispotro E-Commerce App & Storage Metrics
  - job_name: 'jinispotro_app'
    metrics_path: '/metrics.php'
    scrape_interval: 10s
    static_configs:
      - targets: ['app:80']

  # 3. MySQL Database Exporter
  - job_name: 'mysql'
    scrape_interval: 10s
    static_configs:
      - targets: ['mysqld-exporter:9104']

  # 4. Host Node Exporter (Hardware & OS)
  - job_name: 'node'
    scrape_interval: 15s
    static_configs:
      - targets: ['node-exporter:9100']

  # 5. Docker Containers (cAdvisor)
  - job_name: 'cadvisor'
    scrape_interval: 10s
    static_configs:
      - targets: ['cadvisor:8080']

