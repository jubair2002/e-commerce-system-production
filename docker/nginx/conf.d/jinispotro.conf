# ==============================================================================
# Jinispotro Production Nginx Reverse Proxy Configuration
# Provides SSL termination, HTTP/2, and domain routing for Storefront & Grafana.
# ==============================================================================

# 1. Main E-Commerce Application (Storefront & Admin Panel)
server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # For SSL (e.g. Let's Encrypt / Certbot):
    # listen 443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    client_max_body_size 64M;

    location / {
        proxy_pass http://app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }
}

# 2. Grafana Dashboard Subdomain (grafana.domain.com)
server {
    listen 80;
    server_name grafana.domain.com;

    # For SSL (e.g. Let's Encrypt / Certbot):
    # listen 443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/grafana.domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/grafana.domain.com/privkey.pem;

    location / {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for live Grafana dashboard updates
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

