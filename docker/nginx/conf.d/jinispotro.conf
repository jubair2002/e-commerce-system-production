# ==============================================================================
# Jinispotro Production Nginx Reverse Proxy Configuration
# Domain: jinishpotro.store | grafana.jinishpotro.store
# ==============================================================================

# 1. Main E-Commerce Application (Storefront & Admin Panel)
# Handles jinishpotro.store, www.jinishpotro.store, and direct IP fallback
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name jinishpotro.store www.jinishpotro.store _;

    client_max_body_size 64M;

    # Let's Encrypt ACME webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }
}

# 2. Grafana Dashboard Subdomain (grafana.jinishpotro.store)
server {
    listen 80;
    listen [::]:80;
    server_name grafana.jinishpotro.store;

    client_max_body_size 16M;

    # Let's Encrypt ACME webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for live Grafana dashboard updates
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
