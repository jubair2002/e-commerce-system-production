# ==============================================================================
# Jinispotro Production Nginx Reverse Proxy Configuration
# Domain: jinishpotro.store (and www.jinishpotro.store)
# ==============================================================================

# Main E-Commerce Application (Storefront & Admin Panel)
# Handles jinishpotro.store, www.jinishpotro.store, and direct EC2 IP fallback
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name jinishpotro.store www.jinishpotro.store _;

    client_max_body_size 64M;

    # Let's Encrypt / Certbot ACME webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Pass all traffic to the PHP 8.2 Apache app container
    location / {
        proxy_pass http://app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
