{% extends "base.html" %}

{% block content %}
<section class="section py-5">
  <div class="container">
    <div class="empty-state-card py-5">
      <div class="empty-state-icon">
        {{ icon(name='compass', class='empty-state-svg', title='Page Not Found') | safe }}
      </div>
      <h1 class="h2 mb-3">Page Not Found</h1>
      <p class="text-muted mb-4">
        The page you are looking for may have been moved, renamed, or is temporarily unavailable.
      </p>
      <div class="d-flex justify-content-center gap-3">
        <a href="{{ route(name='home') }}" class="btn btn-editorial-primary">
          Back to Home
        </a>
        <a href="{{ route(name='shop') }}" class="btn btn-editorial-secondary">
          Explore Shop
        </a>
      </div>
    </div>
  </div>
</section>
{% endblock content %}
