{% extends "admin/layout.html" %}

{% block content %}
<div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
  <div>
    <div class="mb-2">
      <a href="{{ admin_url(path='analytics.php') }}" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-arrow-left"></i> Back to Analytics Overview
      </a>
    </div>
    <h3 class="mb-1">Product Performance Analytics</h3>
    <p class="text-muted small mb-0">Detailed view of traffic, conversion rate, customer engagement, and units sold.</p>
  </div>
</div>

<div class="row g-3 mb-4">
  <div class="col-sm-6 col-md-3">
    <div class="card stat-card shadow-sm border-0">
      <div class="stat-icon bg-primary-subtle text-primary"><i class="bi bi-eye"></i></div>
      <div>
        <p class="stat-label">Product Views</p>
        <p class="stat-value">--</p>
      </div>
    </div>
  </div>
  <div class="col-sm-6 col-md-3">
    <div class="card stat-card shadow-sm border-0">
      <div class="stat-icon bg-info-subtle text-info"><i class="bi bi-cart-plus"></i></div>
      <div>
        <p class="stat-label">Cart Additions</p>
        <p class="stat-value">--</p>
      </div>
    </div>
  </div>
  <div class="col-sm-6 col-md-3">
    <div class="card stat-card shadow-sm border-0">
      <div class="stat-icon bg-success-subtle text-success"><i class="bi bi-box-seam"></i></div>
      <div>
        <p class="stat-label">Units Sold</p>
        <p class="stat-value">--</p>
      </div>
    </div>
  </div>
  <div class="col-sm-6 col-md-3">
    <div class="card stat-card shadow-sm border-0">
      <div class="stat-icon bg-warning-subtle text-warning"><i class="bi bi-graph-up"></i></div>
      <div>
        <p class="stat-label">Conversion Rate</p>
        <p class="stat-value">--%</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
