<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{{ full_title | default(value="Jinish Potro") }}</title>
	<meta name="description" content="{{ meta_description | default(value="Shop unique Chinese imported products in Bangladesh at Jinishpotro.store.") }}">
	{% if meta_keywords %}
	<meta name="keywords" content="{{ meta_keywords }}">
	{% endif %}
	<meta name="robots" content="{% if robots_allow %}index, follow{% else %}noindex, nofollow{% endif %}">

	<!-- Theme Flash Prevention -->
	<script>
		(function() {
			try {
				var t = localStorage.getItem('jinispotro_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
				document.documentElement.setAttribute('data-theme', t);
			} catch (e) {}
		})();
	</script>

	{% if favicon_url %}
	<link rel="icon" type="image/png" href="{{ favicon_url | safe }}">
	{% else %}
	<link rel="icon" type="image/png" href="{{ url(path='assets/coza/images/icons/favicon.png') | safe }}">
	{% endif %}

<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="{{ url(path='assets/coza/vendor/bootstrap/css/bootstrap.min.css') | safe }}">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="{{ url(path='assets/coza/fonts/font-awesome-4.7.0/css/font-awesome.min.css') | safe }}">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="{{ url(path='assets/coza/fonts/iconic/css/material-design-iconic-font.min.css') | safe }}">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="{{ url(path='assets/coza/fonts/linearicons-v1.0.0/icon-font.min.css') | safe }}">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="{{ url(path='assets/coza/vendor/animate/animate.css') | safe }}">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="{{ url(path='assets/coza/vendor/css-hamburgers/hamburgers.min.css') | safe }}">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="{{ url(path='assets/coza/vendor/animsition/css/animsition.min.css') | safe }}">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="{{ url(path='assets/coza/vendor/select2/select2.min.css') | safe }}">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="{{ url(path='assets/coza/vendor/daterangepicker/daterangepicker.css') | safe }}">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="{{ url(path='assets/coza/vendor/slick/slick.css') | safe }}">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="{{ url(path='assets/coza/vendor/MagnificPopup/magnific-popup.css') | safe }}">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="{{ url(path='assets/coza/vendor/perfect-scrollbar/perfect-scrollbar.css') | safe }}">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="{{ url(path='assets/coza/css/util.css') | safe }}">
	<link rel="stylesheet" type="text/css" href="{{ url(path='assets/coza/css/main.css') | safe }}">
	<link rel="stylesheet" type="text/css" href="{{ url(path='assets/coza/css/coza-custom.css') | safe }}">
<!--===============================================================================================-->

	<script>
		window.SHOP_BASE_URL = "{{ base_url }}";
		window.SHOP_CART_URL = "{{ route(name='cart') }}";
		window.SHOP_CHECKOUT_URL = "{{ route(name='checkout') }}";
		window.SHOP_CSRF_TOKEN = "{{ csrf_token }}";
		window.CUSTOMER_LOGGED_IN = {% if customer %}true{% else %}false{% endif %};
	</script>
	<style>
		/* Progressive enhancement: Instant paint, prevent white flash */
		body.animsition, .animsition {
			opacity: 1 !important;
			-webkit-animation: none !important;
			animation: none !important;
		}
		.animsition-loading-1 {
			display: none !important;
		}

		/* Dynamic Theme Accent Color */
		:root {
			--accent-color: {{ theme_accent_color | default(value='#717fe0') }};
		}
		.bg1, .btn-primary, .pdp-btn-buy, .btn-card-buynow {
			background-color: var(--accent-color) !important;
			border-color: var(--accent-color) !important;
		}
		.btn-card-buynow:hover, .pdp-btn-buy:hover {
			filter: brightness(0.9) !important;
		}
		.hov-bg1:hover {
			background-color: var(--accent-color) !important;
		}
		.cl1, .hov-cl1:hover, a:hover {
			color: var(--accent-color) !important;
		}
		.border-accent {
			border-color: var(--accent-color) !important;
		}
		.icon-header-noti::after {
			background-color: var(--accent-color) !important;
		}

		/* Product card quick-action buttons: Centered from middle & equal width */
		.block2-pic {
			overflow: hidden !important;
			position: relative !important;
		}
		.block2-action-wrap {
			position: absolute !important;
			left: 0 !important;
			right: 0 !important;
			bottom: 10px !important;
			width: 100% !important;
			max-width: 100% !important;
			padding: 0 10px !important;
			box-sizing: border-box !important;
			display: flex !important;
			justify-content: center !important;
			align-items: center !important;
			z-index: 10 !important;
			pointer-events: none !important;
			opacity: 0 !important;
			transform: translateY(8px) !important;
			transition: transform 0.25s ease, opacity 0.25s ease !important;
			margin: 0 auto !important;
		}
		.block2:hover .block2-action-wrap,
		.block2-pic:hover .block2-action-wrap {
			opacity: 1 !important;
			pointer-events: auto !important;
			transform: translateY(0) !important;
		}
		.block2-action-wrap .d-flex {
			width: 100% !important;
			display: flex !important;
			justify-content: center !important;
			align-items: center !important;
			gap: 8px !important;
			margin: 0 auto !important;
		}
		.block2-action-wrap .btn-card-action {
			flex: 1 1 0% !important;
			width: 50% !important;
			max-width: 50% !important;
			display: inline-flex !important;
			align-items: center !important;
			justify-content: center !important;
			text-align: center !important;
			box-sizing: border-box !important;
			height: 38px !important;
			border-radius: 8px !important;
			font-size: 13px !important;
			font-weight: 600 !important;
			padding: 0 6px !important;
			white-space: nowrap !important;
			text-decoration: none !important;
			box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12) !important;
		}
		.block2-action-wrap .btn-card-cart {
			background: #e8e0d5 !important;
			color: #433126 !important;
			border: 1px solid rgba(67, 49, 38, 0.15) !important;
		}
		.block2-action-wrap .btn-card-cart:hover {
			background: #ded4c5 !important;
			color: #2b1f17 !important;
		}
		.block2-action-wrap .btn-card-buynow {
			background: var(--accent-color, #7a5636) !important;
			color: #ffffff !important;
			border: 1px solid var(--accent-color, #7a5636) !important;
		}
		.block2-action-wrap .btn-card-buynow:hover {
			filter: brightness(0.9) !important;
		}
		.block2-action-wrap .btn-card-soldout {
			width: 100% !important;
			max-width: 100% !important;
			background: #6c757d !important;
			color: #ffffff !important;
		}
	</style>
</head>
<body class="animsition">
