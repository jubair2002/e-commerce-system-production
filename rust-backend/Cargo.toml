[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/domain",
    "crates/db",
    "crates/jobs",
    "crates/web",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
common = { path = "crates/common" }
domain = { path = "crates/domain" }
db = { path = "crates/db" }
jobs = { path = "crates/jobs" }

tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust_decimal = { version = "1.36", features = ["serde-float", "maths"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.9", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "mysql", "chrono", "rust_decimal"] }
thiserror = "1.0"
validator = { version = "0.18", features = ["derive"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
aes-gcm = "0.10"
cipher = "0.4"
bcrypt = "0.15"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
md5 = "0.7"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "tracing"] }
tera = "1.20"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "fs", "compression-full"] }
tower-sessions = "0.13.0"
tower-sessions-sqlx-store = { version = "0.14.0", features = ["mysql"] }
axum = { version = "0.7", features = ["macros"] }
dashmap = "6.0"
moka = { version = "0.12", features = ["future"] }
infer = "0.16"
dotenvy = "0.15"
futures = "0.3"
async-stream = "0.3"
serde_urlencoded = "0.7"
